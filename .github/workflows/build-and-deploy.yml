name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.6.2
  ITCH_USERNAME: cats-paw
  ITCH_GAME_ID: machine-jam

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/

          mv /root/.config/godot ~/.config/godot

          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Build Godot Project
        run: |
          mkdir -p build
          godot --headless --export-release Web build/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Upload itch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ./build

  deploy-pages:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-itch:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./build

      - name: Install butler
        run: |
          curl -L -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default

          unzip butler.zip

          chmod +x butler

          sudo mv butler /usr/local/bin/butler

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ./build \
            $ITCH_USERNAME/$ITCH_GAME_ID:web \
            --userversion "${GITHUB_SHA::7}"